name: Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'zensical.toml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'zensical.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy supersedes an in-flight one, but a run that is already
# publishing is never cancelled part-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # Zensical is pre-1.0 and ships often; the pin is what stops a Tuesday
      # release from turning a docs push red. Bump it deliberately.
      - name: Install Zensical
        run: pip install 'zensical==0.0.63'

      # Zensical currently advises against caching on CI while build performance
      # is still being optimised, so there is deliberately no cache step here.
      - name: Build
        run: zensical build --clean --strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: deploy
    # Only main publishes; pull requests build to prove the docs still compile.
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
